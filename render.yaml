services:
  - type: web
    name: choe-gi-ngultrum
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: choe-gi-ngultrum-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: choe-gi-ngultrum-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: choe-gi-ngultrum-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: choe-gi-ngultrum-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: choe-gi-ngultrum-db
          property: password
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

databases:
  - name: choe-gi-ngultrum-db
    databaseName: choe_gi_ngultrum
    user: choe_gi_user
    plan: free
    region: singapore
