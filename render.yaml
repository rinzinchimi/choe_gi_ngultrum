services:
  - type: web
    name: choe-gi-ngultrum
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: choe-gi-ngultrum-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

databases:
  - name: choe-gi-ngultrum-db
    databaseName: choe_gi_ngultrum
    user: choe_gi_user
    plan: free
    region: singapore
